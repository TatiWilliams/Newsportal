{% extends 'flatpages/default.html' %}

{% block content %}
    <h1>Categories</h1>
    <ul>
        {% for category in category_list %}
            <li>
                <a href="{% url 'category_list' category.id %}">{{ category.name }}</a>
                <a href="{% url 'subscribe' category.id %}">Subscribe</a>
            </li>
        {% endfor %}
    </ul>
{% endblock content %}
